[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-study-workflow"
version = "0.1.0"
description = "EEG preprocessing and analysis workflow with human-in-the-loop artifact review and subject-to-group spectral analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "mne>=1.11,<1.14", "numpy>=1.26,<3", "scipy>=1.11,<2",
  "pandas>=2.1,<3", "matplotlib>=3.8,<4", "scikit-learn>=1.4,<2"
]

[project.optional-dependencies]
artifacts = ["pyprep==0.6.0", "autoreject==0.4.3", "mne-icalabel==0.8.1", "onnxruntime>=1.16,<2"]
xdf = ["pyxdf>=1.17,<2"]
eeglab = ["pymatreader>=1.0,<2"]
notebooks = ["jupyterlab>=4,<5"]

[project.scripts]
eeg-workflow = "eeg_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eeg_workflow = ["defaults.json"]
